name: CodeQL

# Análisis estático de seguridad. Corre en cada pull request, en main y una vez por semana para
# detectar vulnerabilidades nuevas en código que no ha cambiado.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analizar (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JavaScript y TypeScript se analizan sin compilar el proyecto.
          build-mode: none

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
