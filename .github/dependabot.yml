version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Las actualizaciones menores y de parche llegan en un solo pull request; las mayores van por
    # separado porque pueden traer cambios incompatibles.
    groups:
      npm-menores:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-menores:
        update-types:
          - minor
          - patch
